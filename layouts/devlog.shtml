<extend template="base.shtml">
<head id="head">
	<style>
		.feed {
			margin-top: 2em;
		}
		
		.feed>div {
			margin: 0 -20px;
			padding: 5px 20px;
			margin-bottom: 1em;
		}
		
		.feed>div>h2 {
			margin-top: 0.4em;
		}
		
		.feed>div[id]:target {
			animation: pulse-div 2s ease-in-out 1 forwards;
		}
		
		@keyframes pulse-div {
			
			0%,
			100% {
				background-color: #222;
			}
			
			50% {
				background-color: #111;
			}
		}
	</style>
</head>
<body id="body">
	<h1 class="title" :text="$page.title"></h1>
	<div :html="$page.contentSection('about')"></div>
	<div class="feed" :loop="$page.contentSections().slice(1)">
		<div id="$loop.it.id">
			<span :text="$loop.it.id.parseDate().format('2006 01-02 (Mon)')"></span>
			<h2><a href="$loop.it.id.prefix('#')" :html="$loop.it.heading()"></a></h2>
			<ctx :html="$loop.it.htmlNoHeading()"></ctx>
			<div :if="$loop.it.data.get?('a')"><p>Hello From hidden</p></div>
		</div>
	</div>
</body>
