<extend template="base.shtml">
<head id="head">
	<style>
		.date {
			font-size: 0.9em;
		}
		
		.title h3{
			margin-top: 0;
		}
	</style>
</head>
<body id="body">
	<h1 :text="$page.title"></h1>
	<div :html="$page.content()"></div>
	<div>
		<h2>Post list</h2>
		<div :loop="$page.subpages()">
			<span class="date" :text="$loop.it.date.format('2006 01-02 (Mon)')"></span>
			<a class="title" href="$loop.it.link()">
				<h3 :text="$loop.it.title"></h3>
			</a>
		</div>
	</div>
</body>
